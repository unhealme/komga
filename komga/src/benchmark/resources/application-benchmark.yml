application.version: BENCHMARK

benchmark:
  result-folder: ${project.reportsDir}/benchmark
  measurement-iterations: 5
  warmup-iterations: 1
  mode: averagetime
  #  measurement-iterations: 1
  #  warmup-iterations: 0
  #  mode: singleshottime
  result-format: text
komga:
  config-dir: ${rootDir}/config-dir
  workspace: diesel
  database:
    url: jdbc:postgresql://localhost:5432/komga?user=komga&password=komga
  lucene:
    data-directory: \${komga.config-dir}/lucene/\${komga.workspace}
spring:
  flyway:
    enabled: true
