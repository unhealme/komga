name: Release

on:
  workflow_dispatch:
    inputs:
      docker_release:
        description: 'Push Docker images'
        default: true
        type: boolean

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        volumes:
          - /var/run/postgresql:/var/run/postgresql

    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Database
        run: psql -v ON_ERROR_STOP=1 -U postgres -f init-db.sql postgres

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: WebUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: WebUI - build
        working-directory: komga-webui
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: NextUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: NextUI - build
        working-directory: next-ui
        run: npm run build:with-i18n

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          java-package: 'jdk'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build
        run: ./gradlew :komga:webuiCopyIndex :komga:nextuiCopyIndex :komga:bootJar :komga-tray:jar

      - name: JReleaser Publish
        if: inputs.docker_release
        run: ./gradlew jreleaserPublish
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: JReleaser Publish output
        if: always() && inputs.docker_release
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-publish
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties
